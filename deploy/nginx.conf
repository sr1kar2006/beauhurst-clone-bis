# Sample nginx config for the static build (dist/). Replace server_name once the URL is confirmed.
# TODO(Faisal): confirm deployment URL / sub-path.
server {
  listen 80;
  server_name _;                      # TODO(Faisal)
  root /var/www/beam-demo;       # contents of dist/

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;

  # Root deployment (VITE_BASE_PATH=/)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Sub-path deployment example (VITE_BASE_PATH=/cma-demo/):
  # location /cma-demo/ {
  #   alias /var/www/beam-demo/;
  #   try_files $uri $uri/ /cma-demo/index.html;
  # }

  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
